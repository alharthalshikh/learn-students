<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية اجتهاد - جاري التحميل...</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #020817;
            color: white;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <span class="loader"></span>
    <div id="status">جاري التحقق من هويتك...</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // منطق التوجيه الذكي
        AuthService.onAuthChanged(async (user) => {
            if (!user) {
                // غير مسجل دخول -> صفحة تسجيل الدخول
                window.location.href = 'login.html';
            } else {
                // مسجل دخول -> جلب البيانات لمعرفة الرتبة
                const userData = await AuthService.getUserData(user.uid);
                if (userData) {
                    if (userData.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'stageone.html';
                    }
                } else {
                    // إذا لم تكن البيانات موجودة بعد (مثلاً أثناء عملية التسجيل)
                    // ننتظر قليلاً ثم نعيد المحاولة أو نوجه لتسجيل الدخول
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
