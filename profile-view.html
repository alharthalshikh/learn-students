<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب - أكاديمية اجتهاد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --bg: #020817; --card: #0f172a; --blue: #3b82f6; --teal: #10b981;
            --text: #f8fafc; --text-muted: #94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        
        .profile-card {
            background:var(--card); width:100%; max-width:400px; border-radius:24px; padding:32px;
            text-align:center; border:1px solid rgba(255,255,255,0.1); box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
            position:relative; overflow:hidden;
        }
        .profile-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:120px;
            background:linear-gradient(135deg, var(--blue), var(--teal)); opacity:0.2; z-index:0;
        }
        
        .avatar {
            width:110px; height:110px; background:var(--card); border-radius:50%; margin:0 auto 16px;
            display:flex; align-items:center; justify-content:center; font-size:50px;
            border:4px solid var(--card); box-shadow:0 0 0 4px var(--blue); position:relative; z-index:1;
        }
        .name { font-size:24px; font-weight:900; margin-bottom:4px; position:relative; z-index:1; }
        .level-badge {
            background:rgba(59,130,246,0.15); color:var(--blue); padding:4px 12px;
            border-radius:20px; font-size:13px; font-weight:700; display:inline-block; margin-bottom:24px;
        }
        
        .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
        .stat-item { background:rgba(255,255,255,0.03); padding:16px; border-radius:16px; border:1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size:20px; font-weight:800; display:block; color:var(--blue); }
        .stat-lbl { font-size:12px; color:var(--text-muted); }
        
        .achievements-box { text-align:right; }
        .ach-title { font-size:14px; font-weight:700; margin-bottom:12px; color:var(--text-muted); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px; }
        .ach-icons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .ach-icon { font-size:24px; filter:grayscale(1); opacity:0.3; transition:0.3s; }
        .ach-icon.unlocked { filter:grayscale(0); opacity:1; transform:scale(1.1); }
        
        .loader { width:30px; height:30px; border:3px solid #fff; border-bottom-color:transparent; border-radius:50%; display:inline-block; animation:rot 1s linear infinite; }
        @keyframes rot { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        
        .footer-logo { margin-top:32px; font-size:14px; font-weight:800; color:var(--text-muted); opacity:0.5; }
    </style>
</head>
<body>
    <div class="profile-card" id="profileContent">
        <div class="loader"></div>
        <p style="margin-top:10px;">جاري تحميل ملف الطالب...</p>
    </div>

    <script>
        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            
            if (!uid) {
                document.getElementById('profileContent').innerHTML = '<h2>عذراً، الرابط غير صحيح</h2>';
                return;
            }

            try {
                const doc = await db.collection('users').doc(uid).get();
                if (!doc.exists) {
                    document.getElementById('profileContent').innerHTML = '<h2>لم يتم العثور على الطالب</h2>';
                    return;
                }

                const u = doc.data();
                const totalLessons = u.completedLessons ? u.completedLessons.length : 0;
                
                // تحديد الإنجازات المفتوحة
                const achs = [
                    { icon: '🌟', unlocked: totalLessons >= 1 },
                    { icon: '🔥', unlocked: u.streak >= 7 },
                    { icon: '📚', unlocked: totalLessons >= 10 },
                    { icon: '🏅', unlocked: u.xp >= 100 },
                    { icon: '⚡', unlocked: u.xp >= 500 }
                ];

                const isImg = u.avatar && u.avatar.startsWith('data:image/');
                const avatarHTML = isImg 
                    ? `<img src="${u.avatar}" style="width:100%; height:100%; object-fit:cover;">` 
                    : u.avatar || '🧑‍🎓';

                document.getElementById('profileContent').innerHTML = `
                    <div class="avatar">${avatarHTML}</div>
                    <h1 class="name">${u.name}</h1>
                    <div class="level-badge">المستوى ${u.level || 1}</div>
                    
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-val">${u.xp || 0}</span>
                            <span class="stat-lbl">نقطة خبرة</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-val">${u.streak || 0} 🔥</span>
                            <span class="stat-lbl">أيام التعلم</span>
                        </div>
                    </div>

                    <div class="achievements-box">
                        <div class="ach-title">الأوسمة والإنجازات</div>
                        <div class="ach-icons">
                            ${achs.map(a => `<span class="ach-icon ${a.unlocked ? 'unlocked' : ''}">${a.icon}</span>`).join('')}
                        </div>
                    </div>

                    <div class="footer-logo">أكاديمية اجتهاد 🎓</div>
                `;
            } catch (e) {
                console.error(e);
                document.getElementById('profileContent').innerHTML = '<h2>حدث خطأ أثناء تحميل البيانات</h2>';
            }
        }
        loadProfile();
    </script>
</body>
</html>
